version: "3.8"

services:
  windshift:
    image: ghcr.io/windshiftapp/windshift:0.9.6
    restart: unless-stopped
    environment:
      - BASE_URL=https://${DOMAIN}
      - PORT=8080
      - USE_PROXY=true
      # The blueprint template sets PROXY_TRUST_MODE=strict and requires the
      # proxy address for fresh installs. The "legacy" fallback below keeps an
      # existing installation on its current behavior when only this manifest is
      # refreshed. Strict trusts only loopback and ADDITIONAL_PROXIES; see
      # deploy/proxy-trust.md in the Windshift repository. Diagnostics ->
      # Proxy trust reports an unlisted proxy.
      - PROXY_TRUST_MODE=${PROXY_TRUST_MODE:-legacy}
      - ADDITIONAL_PROXIES=${ADDITIONAL_PROXIES:-}
      - SSO_SECRET=${SSO_SECRET}
      - ATTACHMENT_PATH=/data/attachments
      - DB_TYPE=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    volumes:
      - windshift-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.4
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  windshift-data: {}
  postgres-data: {}
